<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>核心岗位人才 mapping 汇总看板</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>/* ============ 基础 ============ */
:root {
  --paper: #f4f0e7;
  --paper-2: #fbf8f1;
  --paper-3: #efe9dc;
  --ink: #191713;
  --ink-2: #3b352c;
  --muted: #7b7264;
  --line: #d9d1c0;
  --line-strong: #b9ae9a;
  --red: #b0232c;
  --gold: #8e6a33;
  --moss: #3e5547;
  --serif: "Noto Serif SC", "Songti SC", serif;
  --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", ui-monospace, monospace;
  --max: 1300px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection { background: var(--red); color: #fff8ee; }

a { color: inherit; }

.wrap {
  width: min(var(--max), calc(100% - 112px));
  margin: 0 auto;
}

.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ============ 顶栏 ============ */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(244, 240, 231, 0.94);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px);
}

.topbar-in {
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.brand { display: flex; align-items: center; gap: 12px; }

.seal {
  width: 28px;
  height: 28px;
  background: var(--red);
  color: #fff7ea;
  font-family: var(--serif);
  font-weight: 700;
  font-size: 15px;
  display: grid;
  place-items: center;
  letter-spacing: 0;
}

.brand-name { font-size: 14px; font-weight: 700; letter-spacing: 0.02em; }
.brand-div { width: 1px; height: 14px; background: var(--line-strong); }
.brand-sub { font-family: var(--mono); font-size: 10.5px; color: var(--muted); letter-spacing: 0.06em; }

.top-meta { display: flex; align-items: center; gap: 18px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); letter-spacing: 0.05em; }
.top-meta b { color: var(--ink); font-weight: 500; }

/* ============ 首屏 ============ */
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(320px, 0.82fr);
  gap: 72px;
  padding: 76px 0 52px;
  align-items: start;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.22em;
  color: var(--red);
  text-transform: uppercase;
  margin-bottom: 26px;
}

.eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--line); max-width: 120px; }

.hero h1 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 900;
  font-size: clamp(46px, 5.6vw, 82px);
  line-height: 1.04;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

.hero h1 .accent { color: var(--red); }

.hero-lede {
  margin: 26px 0 0;
  max-width: 50ch;
  font-size: 16.5px;
  line-height: 1.85;
  color: var(--ink-2);
  text-wrap: pretty;
}

.hero-lede strong { font-weight: 600; color: var(--ink); }

.hero-meta {
  margin-top: 34px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px 28px;
  font-size: 12px;
  color: var(--muted);
}

.hero-meta span { display: inline-flex; gap: 8px; align-items: baseline; }
.hero-meta em { font-family: var(--mono); font-style: normal; font-size: 10px; letter-spacing: 0.1em; color: var(--line-strong); }

/* 截止时序 */
.rail { border-top: 1px solid var(--ink); padding-top: 16px; }
.rail-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
.rail-head h2 { margin: 0; font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.16em; color: var(--ink); }
.rail-head span { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.rail-month { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; color: var(--muted); margin: 14px 0 2px; display: flex; justify-content: space-between; }
.rail-item {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: baseline;
  width: 100%;
  padding: 9px 0;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: none;
  text-align: left;
  font-family: inherit;
  cursor: pointer;
  color: var(--ink);
}
.rail-item:hover .rail-name { color: var(--red); }
.rail-date { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.rail-name { font-size: 13px; font-weight: 500; transition: color 0.18s; }
.rail-owner { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.rail-item.is-overdue .rail-date { color: var(--red); }
.rail-item.is-overdue .rail-name::after { content: "· 逾期"; font-size: 10px; color: var(--red); margin-left: 4px; font-family: var(--mono); }

/* ============ 数据条 ============ */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--line);
}

.stat { padding: 24px 28px 26px 0; border-right: 1px solid var(--line); }
.stat:last-child { border-right: 0; }
.stat-num { font-family: var(--mono); font-size: 40px; font-weight: 500; letter-spacing: -0.03em; line-height: 1.1; }
.stat-num i { font-style: normal; font-size: 13px; color: var(--muted); margin-left: 5px; letter-spacing: 0; }
.stat-label { margin-top: 8px; font-size: 12px; color: var(--muted); }
.stat-label b { color: var(--ink-2); font-weight: 500; }

/* ============ 岗位索引 ============ */
.index-sec { padding: 66px 0 0; }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 22px; }
.sec-head h2 { margin: 0; font-family: var(--serif); font-weight: 700; font-size: 30px; letter-spacing: -0.01em; }
.sec-head .hint { font-family: var(--mono); font-size: 10.5px; color: var(--muted); letter-spacing: 0.06em; }

.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip {
  border: 1px solid var(--line-strong);
  background: transparent;
  color: var(--ink-2);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.02em;
  padding: 6px 11px;
  cursor: pointer;
  transition: all 0.16s;
}
.chip:hover { border-color: var(--ink); }
.chip.is-on { background: var(--ink); border-color: var(--ink); color: var(--paper-2); }
.search {
  border: 1px solid var(--line-strong);
  background: var(--paper-2);
  padding: 7px 11px;
  font-family: var(--sans);
  font-size: 12px;
  color: var(--ink);
  width: 188px;
  outline: none;
}
.search:focus { border-color: var(--ink); }
.search::placeholder { color: var(--muted); }

.index { border-top: 1px solid var(--ink); margin-top: 6px; }
.index-head, .index-row {
  display: grid;
  grid-template-columns: 48px minmax(0, 1.5fr) minmax(0, 0.95fr) 74px 104px 66px 62px 96px;
  gap: 14px;
  align-items: center;
  padding: 0 6px;
}
.index-head {
  height: 36px;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.12em;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
}
.index-row {
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--line);
  padding: 15px 6px;
  font-family: inherit;
  color: inherit;
  cursor: pointer;
  transition: background 0.16s;
}
.index-row:hover { background: rgba(255, 252, 244, 0.72); }
.index-row:hover .ir-name { color: var(--red); }
.ir-no { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.ir-name { font-family: var(--serif); font-size: 18px; font-weight: 700; line-height: 1.3; transition: color 0.16s; }
.ir-alias { display: block; font-family: var(--sans); font-size: 10.5px; font-weight: 400; color: var(--muted); margin-top: 2px; }
.ir-dept, .ir-owner { font-size: 12px; color: var(--ink-2); }
.ir-owner { font-family: var(--mono); font-size: 11px; }
.ir-date { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.ir-count { font-family: var(--mono); font-size: 13px; }
.ir-count span { font-size: 9.5px; color: var(--line-strong); margin-left: 2px; }

.status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.04em;
  padding: 3px 6px;
  border: 1px solid var(--line-strong);
  color: var(--ink-2);
  white-space: nowrap;
}
.status::before { content: ""; width: 4px; height: 4px; background: currentColor; }
.status.is-overdue { color: var(--red); border-color: rgba(176, 35, 44, 0.45); }
.status.is-soon { color: var(--gold); border-color: rgba(142, 106, 51, 0.45); }
.status.is-later { color: var(--moss); border-color: rgba(62, 85, 71, 0.35); }

.empty { padding: 36px 6px; color: var(--muted); font-size: 13px; }

/* ============ 岗位详情 ============ */
.roles { padding-top: 10px; }

.role {
  border-top: 1px solid var(--line-strong);
  padding: 62px 0 14px;
  scroll-margin-top: 78px;
}
.role:first-child { border-top-color: var(--ink); }

.role-head { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 16px; align-items: start; }
.role-no { font-family: var(--mono); font-size: 12px; color: var(--red); padding-top: 11px; letter-spacing: 0.04em; }
.role-title h2 { margin: 0; font-family: var(--serif); font-size: clamp(30px, 3vw, 40px); font-weight: 700; line-height: 1.2; letter-spacing: -0.015em; }
.role-sub { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); letter-spacing: 0.02em; }
.role-sub .sep { color: var(--line-strong); }
.role-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; padding-top: 8px; }
.doc-link { font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); text-decoration: none; border-bottom: 1px solid var(--line-strong); padding-bottom: 2px; }
.doc-link:hover { color: var(--red); border-color: var(--red); }

.role-lede {
  margin: 20px 0 38px 72px;
  max-width: 64ch;
  font-family: var(--serif);
  font-size: 20px;
  line-height: 1.75;
  color: var(--ink-2);
  text-wrap: pretty;
}

.role-grid { display: grid; grid-template-columns: 294px minmax(0, 1fr); gap: 54px; margin-left: 72px; align-items: start; }
.role-aside {
  position: sticky;
  top: 84px;
  max-height: calc(100vh - 112px);
  overflow-y: auto;
  padding-right: 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}
.role-aside::-webkit-scrollbar { width: 4px; }
.role-aside::-webkit-scrollbar-thumb { background: var(--line-strong); }

.block { margin-bottom: 34px; }
.block-title {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin: 0 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line-strong);
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 0.16em;
  color: var(--ink);
}
.block-title em { font-style: normal; color: var(--muted); letter-spacing: 0.04em; font-size: 9.5px; }

.prose { margin: 0; font-size: 13px; line-height: 1.82; color: var(--ink-2); text-wrap: pretty; }
.prose + .prose { margin-top: 10px; }

.scope { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
.scope span { font-family: var(--mono); font-size: 10px; padding: 3px 6px; background: var(--paper-3); color: var(--ink-2); }

.caps { display: grid; gap: 12px; }
.cap-t { font-size: 13px; font-weight: 600; }
.cap-d { font-size: 12.5px; line-height: 1.72; color: var(--muted); margin-top: 2px; }

.fit-row { display: grid; grid-template-columns: 40px 1fr; gap: 8px; padding: 9px 0; border-bottom: 1px dotted var(--line-strong); }
.fit-row:last-child { border-bottom: 0; }
.fit-k { font-family: var(--mono); font-size: 9.5px; color: var(--muted); padding-top: 3px; letter-spacing: 0.04em; }
.fit-v { font-size: 12.5px; line-height: 1.75; color: var(--ink-2); }

.kw { display: flex; flex-wrap: wrap; gap: 5px; }
.kw span { font-size: 11.5px; padding: 4px 8px; border: 1px solid var(--line); color: var(--ink-2); background: rgba(251, 248, 241, 0.7); }

/* 梯队 */
.tier { padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px dashed var(--line-strong); }
.tier:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
.tier-head { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin-bottom: 12px; }
.tier-dot { width: 7px; height: 7px; flex: 0 0 7px; transform: translateY(-1px); }
.tier-1 .tier-dot { background: var(--red); }
.tier-2 .tier-dot { background: var(--gold); }
.tier-3 .tier-dot { background: var(--moss); }
.tier-label { font-size: 14px; font-weight: 700; letter-spacing: 0.01em; }
.tier-desc { font-size: 11.5px; color: var(--muted); font-family: var(--mono); letter-spacing: 0.01em; }
.companies { display: grid; grid-template-columns: 1fr 1fr; gap: 0 26px; }
.co { padding: 11px 0 12px; border-top: 1px solid var(--line); }
.co-name { font-size: 13.5px; font-weight: 600; }
.co-why { margin-top: 4px; font-size: 12.5px; line-height: 1.72; color: var(--muted); text-wrap: pretty; }

/* 候选人 */
.shortlist { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sc {
  background: var(--paper-2);
  border: 1px solid var(--line);
  padding: 15px 17px 16px;
  transition: border-color 0.16s, transform 0.16s;
}
.sc:hover { border-color: var(--line-strong); }
.sc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.sc-name { font-family: var(--serif); font-size: 19px; font-weight: 700; line-height: 1.25; }
.sc-meta { margin-top: 3px; font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.01em; }
.sc-note { margin-top: 10px; font-size: 12.5px; line-height: 1.72; color: var(--ink-2); text-wrap: pretty; }
.sc-foot { margin-top: 11px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sc-status { font-family: var(--mono); font-size: 9.5px; color: var(--ink-2); background: var(--paper-3); padding: 3px 7px; letter-spacing: 0.02em; }
.sc-score { font-family: var(--mono); font-size: 10px; color: var(--ink-2); }
.sc-score b { font-size: 14px; font-weight: 500; }
.rating { display: inline-flex; gap: 2px; }
.rating i { width: 5px; height: 5px; background: var(--line-strong); display: block; }
.rating i.on { background: var(--red); }

.bench { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 12px; }
.bench-item { background: var(--paper-2); padding: 11px 13px; }
.bench-name { font-size: 12.5px; font-weight: 600; }
.bench-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* 人才地图 */
.map-group { display: grid; grid-template-columns: 176px minmax(0, 1fr); gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.map-group:last-child { border-bottom: 0; }
.mg-name { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--muted); padding-top: 5px; }
.mg-list { display: grid; gap: 9px; }
.mg-co { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.mg-co-name { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.people { display: flex; flex-wrap: wrap; gap: 4px; }
.person { display: inline-flex; align-items: baseline; gap: 5px; background: var(--paper-3); padding: 3px 7px; font-size: 11.5px; line-height: 1.5; }
.person b { font-weight: 500; }
.person span { font-family: var(--mono); font-size: 9.5px; color: var(--muted); }

/* 面试要点 */
.qa { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.qa li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 9px 0; border-bottom: 1px dotted var(--line-strong); font-size: 12.5px; line-height: 1.75; color: var(--ink-2); }
.qa li:last-child { border-bottom: 0; }
.qa li::before { content: counter(qa, decimal-leading-zero); counter-increment: qa; font-family: var(--mono); font-size: 9.5px; color: var(--line-strong); padding-top: 4px; }
.qa { counter-reset: qa; }

.note { border: 1px solid var(--line-strong); background: #f7f1e4; padding: 14px 16px; font-size: 12.5px; line-height: 1.8; color: var(--ink-2); text-wrap: pretty; }
.note b { font-weight: 600; }

/* 表格 */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; min-width: 560px; }
table.tbl th { font-family: var(--mono); font-size: 9.5px; font-weight: 500; letter-spacing: 0.06em; color: var(--muted); text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--ink); white-space: nowrap; }
table.tbl td { font-size: 12px; padding: 9px; border-bottom: 1px solid var(--line); color: var(--ink-2); vertical-align: top; }
table.tbl td:first-child { font-weight: 500; color: var(--ink); }
table.tbl tr:last-child td { border-bottom: 0; }

/* ============ 页脚 ============ */
.footer { border-top: 1px solid var(--ink); margin-top: 64px; padding: 36px 0 72px; }
.footer-in { display: grid; grid-template-columns: 1.4fr 1fr; gap: 60px; align-items: start; }
.footer h3 { margin: 0 0 12px; font-family: var(--serif); font-size: 20px; }
.footer p { margin: 0; font-size: 12.5px; line-height: 1.85; color: var(--muted); max-width: 62ch; }
.footer-note { font-family: var(--mono); font-size: 10px; color: var(--line-strong); letter-spacing: 0.04em; line-height: 1.9; text-align: right; }

/* ============ 侧边导航 ============ */
.sidenav {
  position: fixed;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 30;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 10px 8px;
  background: rgba(244, 240, 231, 0.86);
  border: 1px solid var(--line);
  backdrop-filter: blur(6px);
}
.sidenav button {
  border: 0;
  background: none;
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--muted);
  padding: 3px 5px;
  cursor: pointer;
  text-align: right;
  transition: color 0.16s;
}
.sidenav button:hover { color: var(--ink); }
.sidenav button.is-on { color: var(--red); }

/* ============ 密度 ============ */
.app[data-density="compact"] .role { padding-top: 44px; }
.app[data-density="compact"] .role-lede { font-size: 18px; margin-bottom: 28px; }
.app[data-density="compact"] .block { margin-bottom: 24px; }
.app[data-density="compact"] .sc { padding: 12px 14px; }
.app[data-density="compact"] .sc-note { font-size: 12px; }
.app[data-density="compact"] .stat { padding-top: 18px; padding-bottom: 20px; }
.app[data-density="compact"] .stat-num { font-size: 34px; }

/* ============ 响应式 ============ */
@media (max-width: 1240px) {
  .sidenav { display: none; }
  .wrap { width: calc(100% - 72px); }
  .hero { gap: 48px; }
  .role-grid { grid-template-columns: 260px minmax(0, 1fr); gap: 36px; }
}

@media (max-width: 1080px) {
  .hero { grid-template-columns: 1fr; gap: 44px; }
  .role-aside { max-height: none; overflow: visible; padding-right: 0; }
  .rail { max-width: 560px; }
  .role-grid { grid-template-columns: 1fr; }
  .role-aside { position: static; display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .index-head { display: none; }
  .index-row { grid-template-columns: 40px minmax(0, 1fr) 88px 60px 90px; }
  .ir-dept, .ir-owner, .ir-count.co { display: none; }
  .map-group { grid-template-columns: 120px minmax(0, 1fr); }
  .footer-in { grid-template-columns: 1fr; gap: 24px; }
  .footer-note { text-align: left; }
}

@media (max-width: 820px) {
  .wrap { width: calc(100% - 40px); }
  .top-meta .tm-hide { display: none; }

  <script>/* ============================================================
   核心岗位人才 mapping 汇总看板 · 应用层

(function () {
  "use strict";

  /* ---------- 数据层 ---------- */
  var LS_KEY = "hdl_mapping_hub_v1";

  function deep(o) { return JSON.parse(JSON.stringify(o)); }

  /* ---------- 云端同步配置（Supabase） ----------
     填入 url 与 anonKey 后启用：公开读取 + 实时推送；编辑需口令（数据库 RLS 校验）。
     留空或 supabase-js 未加载时自动退回纯本地模式，功能不受影响。 */
  var CLOUD = {
    url: "",      /* 例：https://xxxx.supabase.co */
    anonKey: "",  /* Supabase anon public key */
    table: "mapping_state"
  };
  var cloudOn = !!(CLOUD.url && CLOUD.anonKey && window.supabase);
  var sb = null, sbWrite = null, editKey = "", pushTimer = null, pendingRemote = null;
  if (cloudOn) {
    try { sb = window.supabase.createClient(CLOUD.url, CLOUD.anonKey); }
    catch (e) { cloudOn = false; }
  }

  function pickState() {
    var embedded = null, saved = null;
    try {
      var raw = document.getElementById("embedded-data").textContent.trim();
      if (raw) embedded = JSON.parse(raw);
    } catch (e) { embedded = null; }
    try {
      var ls = localStorage.getItem(LS_KEY);
      if (ls) saved = JSON.parse(ls);
    } catch (e) { saved = null; }
    function ok(s) { return s && s.meta && Array.isArray(s.roles) && s.roles.length >= 0; }
    if (ok(embedded) && ok(saved)) return (saved.stamp || 0) > (embedded.stamp || 0) ? saved : embedded;
    if (ok(saved)) return saved;
    if (ok(embedded)) return embedded;
    return deep(ORIGINAL);
  }

  var S = pickState();
  /* 营建负责人源文档链接更正（兼容旧本地存档） */
  var BUILD_URL_OLD = "https://haidilao.feishu.cn/docx/YhCVwiqcYi4gOxkcjxfcZz2RnEc";
  var BUILD_URL_NEW = "https://haidilao.feishu.cn/docx/DGdxdDEeQoE4vXxNJRFcwiPbnGe?302from=wiki";
  S.roles.forEach(function (r) {
    if (r.id === "build" && r.source && r.source.url === BUILD_URL_OLD) r.source.url = BUILD_URL_NEW;
  });
  var EDIT = false;
  var query = "";
  var owner = "全部";

  function save() {
    S.stamp = Date.now();
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { }
    if (cloudOn && sbWrite) { setSaveState("已保存 · 云端同步中…"); queuePush(); }
    else if (cloudOn) setSaveState("已本地保存 · 解锁编辑口令后同步云端");
    else setSaveState("已自动保存 " + clockNow());
  }

  /* ---------- 云端同步 ---------- */
  function clockNow() {
    var t = new Date();
    return [t.getHours(), t.getMinutes(), t.getSeconds()].map(function (n) { return String(n).padStart(2, "0"); }).join(":");
  }
  function setSaveState(txt) {
    var el = document.getElementById("save-state");
    if (el) el.textContent = txt;
  }
  function validState(s) { return s && s.meta && Array.isArray(s.roles); }
  function queuePush() {
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushNow, 700);
  }
  function pushNow() {
    if (!sbWrite) return;
    sbWrite.from(CLOUD.table).upsert({ id: 1, data: S, updated_at: new Date().toISOString() }).then(function (res) {
      if (res.error) setSaveState("云端同步失败：" + (res.error.message || "请检查编辑口令"));
      else setSaveState("已同步云端 " + clockNow());
    });
  }
  function applyRemote(data) {
    if (!validState(data)) return;
    if ((data.stamp || 0) <= (S.stamp || 0)) return; /* 自己的回声或更旧的数据 */
    var ae = document.activeElement;
    if (ae && ae.getAttribute && ae.getAttribute("data-path")) { pendingRemote = data; return; } /* 正在打字，稍后应用 */
    S = data;
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { }
    render(true);
    setSaveState("已同步他人更新 " + clockNow());
  }
  function cloudInit() {
    if (!cloudOn) return;
    sb.from(CLOUD.table).select("data").eq("id", 1).maybeSingle().then(function (res) {
      if (res.error) { setSaveState("云端连接失败：" + res.error.message); return; }
      if (res.data && res.data.data) applyRemote(res.data.data);
      else setSaveState("云端待初始化 · 解锁编辑后自动上传");
      sb.channel("mapping-sync").on("postgres_changes",
        { event: "*", schema: "public", table: CLOUD.table, filter: "id=eq.1" },
        function (payload) {
          var row = payload.new;
          if (row && row.data) applyRemote(row.data);
        }).subscribe();
    });
  }
  /* 编辑口令解锁：数据库端校验（RLS + check_edit_key），口令不写进页面代码 */
  function unlockEdit(cb) {
    if (!cloudOn || editKey) { cb(); return; }
    var k = prompt("此看板已启用云端同步，进入编辑模式请输入编辑口令：");
    if (!k) return;
    setSaveState("校验口令…");
    sb.rpc("check_edit_key", { k: k }).then(function (res) {
      if (res.error || res.data !== true) { setSaveState(""); alert("口令不正确，无法进入编辑模式。"); return; }
      editKey = k;
      sbWrite = window.supabase.createClient(CLOUD.url, CLOUD.anonKey, { global: { headers: { "x-edit-key": k } } });
      sb.from(CLOUD.table).select("id").eq("id", 1).maybeSingle().then(function (r2) {
        if (!r2.error && !r2.data) { S.stamp = Date.now(); queuePush(); } /* 首次解锁：初始化云端数据 */
        cb();
      });
    });
  }

  /* ---------- 工具 ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function getPath(obj, path) {
    return path.split(".").reduce(function (o, k) { return o == null ? o : o[k]; }, obj);
  }
  function setPath(obj, path, val) {
    var ks = path.split("."), last = ks.pop();
    var t = ks.reduce(function (o, k) { return o[k]; }, obj);
    t[last] = val;
  }
  function isPlaceholder(name) { return !name || name.indexOf("待补") === 0 || name === "待补全"; }
  function roleStats(r) {
    var companies = {}, names = {};
    (r.pools || []).forEach(function (p) { (p.companies || []).forEach(function (c) { companies[c.name] = 1; }); });
    (r.shortlist || []).forEach(function (c) { names[c.name] = 1; });
    (r.map || []).forEach(function (g) {
      (g.companies || []).forEach(function (c) {
        (c.people || []).forEach(function (p) { if (!isPlaceholder(p.name)) names[p.name] = 1; });
      });
    });
    return { companies: Object.keys(companies).length, people: Object.keys(names).length, shortlist: (r.shortlist || []).length };
  }
  function roleCount() {
    return S.roles.length + S.roles.filter(function (r) { return r.alias; }).length;
  }
  function ownerList() {
    var list = [];
    S.roles.forEach(function (r) { if (r.owner && list.indexOf(r.owner) < 0) list.push(r.owner); });
    return ["全部"].concat(list);
  }
  function findRole(id) {
    for (var i = 0; i < S.roles.length; i++) if (S.roles[i].id === id) return i;
    return -1;
  }

  /* ---------- 可编辑元素 ---------- */
  function E(path, text, opts) {
    opts = opts || {};
    var tag = opts.tag || "span";
    var cls = opts.cls ? ' class="' + opts.cls + '"' : "";
    var val = text == null ? "" : String(text);
    if (!EDIT) {
      if (val === "") return opts.hideEmpty ? "" : "<" + tag + cls + '><span class="ph">' + esc(opts.ph || "待填写") + "</span></" + tag + ">";
      return "<" + tag + cls + ">" + esc(val) + "</" + tag + ">";
    }
    return "<" + tag + cls + ' data-path="' + path + '" data-type="' + (opts.type || "text") +
      '" contenteditable="true" spellcheck="false" data-ph="' + esc(opts.ph || "点击填写") + '">' + esc(val) + "</" + tag + ">";
  }
  function addBtn(path, tpl, label, inline) {
    if (!EDIT) return "";
    return '<button class="add-btn' + (inline ? " inline" : "") + '" data-add="' + path + '" data-tpl="' + tpl + '">＋ ' + esc(label) + "</button>";
  }

    if (!EDIT) return "";
    return '<button class="del-btn' + (abs ? " abs" : "") + '" data-del="' + path + '" title="删除该条目">×</button>';
  }

  function filteredRoles() {

    (r.keywords || []).forEach(function (k, ki) {
      h += '<span class="ed-tag">' + E(b + ".keywords." + ki, k) + delBtn(b + ".keywords." + ki) + "</span>";
    });
    h += addBtn(b + ".keywords", "str", "关键词", true) + "</div></div></aside>";

    /* 主区 */
    h += '<div class="role-main"><div class="block"><h3 class="block-title"><span>人才池梯队</span><em>' + s.companies + " 家目标公司</em></h3>";
    (r.pools || []).forEach(function (p, pi) { h += tierBlock(r, b, pi); });
    h += addBtn(b + ".pools", "tier", "添加梯队") + "</div>";

    h += shortlistBlock(r, b);
    (r.tables || []).forEach(function (t, ti) { h += tableBlock(r, b, ti); });
    h += addBtn(b + ".tables", "table", "添加表格");
    h += mapBlock(r, b);

    h += '<div class="block"><h3 class="block-title"><span>面试重点区分</span></h3><ol class="qa">';
    (r.interview || []).forEach(function (q, qi) {
      h += '<li><span class="ed-row">' + E(b + ".interview." + qi, q) + delBtn(b + ".interview." + qi) + "</span></li>";
    });
    h += "</ol>" + addBtn(b + ".interview", "str", "添加面试要点") + "</div>";

    h += '<div class="block"><h3 class="block-title"><span>风险与提醒</span></h3><div class="note"><b>注意 · </b>' + E(b + ".risk", r.risk) + "</div></div>";
    h += "</div></div></section>" + footer() + "</main>";

    /* 侧边快速切换 */
    h += '<nav class="sidenav no-print" aria-label="mapping 快速切换">';
    S.roles.forEach(function (x) {
      h += '<button class="' + (x.id === r.id ? "is-on" : "") + '" data-go="role:' + x.id + '" title="' + esc(x.name) + '">' + esc(x.no) + "</button>";
    });
    h += "</nav>";
    return h;
  }

  /* ---------- 渲染 & 路由 ---------- */
  var app = document.getElementById("app");
  function currentRoute() {
    var m = location.hash.match(/^#\/role\/(.+)$/);
    if (m) {
      var i = findRole(decodeURIComponent(m[1]));
      if (i >= 0) return { view: "role", i: i };
    }
    return { view: "dash" };
  }
  function render(keepScroll) {
    var y = window.scrollY;
    var rt = currentRoute();
    app.innerHTML = rt.view === "role" ? renderRole(rt.i) : renderDash();
    document.body.classList.toggle("edit-on", EDIT);
    if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", function () { render(false); });

  /* ---------- 导出 / 导入 ---------- */
  function download(blob, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }
  function exportJSON() {
    download(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }), "mapping汇总数据.json");
  }
  function exportHTML() {
    var clone = document.documentElement.cloneNode(true);
    var emb = clone.querySelector("#embedded-data");
    emb.textContent = JSON.stringify(S).replace(/<\//g, "<\\/");
    clone.querySelector("#app").innerHTML = "";
    clone.querySelector("body").classList.remove("edit-on");
    var html = "<!DOCTYPE html>\n" + clone.outerHTML;
    download(new Blob([html], { type: "text/html;charset=utf-8" }), "核心岗位人才mapping汇总看板.html");
  }
  function importJSON(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (!data || !data.meta || !Array.isArray(data.roles)) throw new Error("格式不符");
        if (!confirm("导入将覆盖当前看板数据（" + data.roles.length + " 份 mapping），确定继续？")) return;
        unlockEdit(function () {
          S = data;
          save();
          render(false);
        });
      } catch (e) {
        alert("导入失败：文件不是有效的 mapping 数据 JSON。");
      }
    };
    reader.readAsText(file, "utf-8");
  }

  /* ---------- 事件 ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target;
    var go = t.closest("[data-go]");
    if (go) {
      var v = go.getAttribute("data-go");
      location.hash = v === "dash" ? "#/" : "#/role/" + v.slice(5);
      return;
    }
    var chip = t.closest("[data-owner]");
    if (chip) { owner = chip.getAttribute("data-owner"); render(true); return; }
    var add = t.closest("[data-add]");
    if (add) {
      var path = add.getAttribute("data-add");
      var arr = getPath(S, path);
      if (!Array.isArray(arr)) { arr = []; setPath(S, path, arr); }
      arr.push(makeTpl(add.getAttribute("data-tpl"), path));
      save(); render(true); return;
    }
    var addcol = t.closest("[data-addcol]");
    if (addcol) {
      var tb = getPath(S, addcol.getAttribute("data-addcol"));
      tb.columns.push("新列");
      tb.rows.forEach(function (row) { row.push(""); });
      save(); render(true); return;
    }
    var delcol = t.closest("[data-delcol]");
    if (delcol) {
      if (!confirm("确定删除该列？")) return;
      var parts = delcol.getAttribute("data-delcol").split(":");
      var tt = getPath(S, parts[0]), ci = Number(parts[1]);
      tt.columns.splice(ci, 1);
      tt.rows.forEach(function (row) { row.splice(ci, 1); });
      save(); render(true); return;
    }
    var del = t.closest("[data-del]");
    if (del) {
      if (!confirm("确定删除该条目？")) return;
      var ks = del.getAttribute("data-del").split("."), idx = Number(ks.pop());
      var parent = ks.reduce(function (o, k) { return o[k]; }, S);
      parent.splice(idx, 1);
      save(); render(true); return;
    }
    var act = t.closest("[data-act]");
    if (!act) return;
    var a = act.getAttribute("data-act");
    if (a === "toggle-edit") {
      if (!EDIT) unlockEdit(function () { EDIT = true; render(true); });
      else { EDIT = false; render(true); }
    }
    else if (a === "print") { window.print(); }
    else if (a === "export-html") { exportHTML(); }
    else if (a === "export-json") { exportJSON(); }
    else if (a === "import-json") { document.getElementById("import-file").click(); }
    else if (a === "reset") {
      if (confirm("恢复为原始数据？所有修改将被清除（建议先导出 HTML 备份）。")) {
        unlockEdit(function () { S = deep(ORIGINAL); save(); render(false); });
      }
    }
    else if (a === "add-role") {
      unlockEdit(function () {
        var nr = newRole();
        S.roles.push(nr);
        save();
        EDIT = true;
        location.hash = "#/role/" + nr.id;
        render(false);
      });
    }
    else if (a === "del-role") {
      var rt = currentRoute();
      if (rt.view !== "role") return;
      var rr = S.roles[rt.i];
      if (!confirm("确定删除「" + rr.name + "」这份 mapping？（建议先导出 HTML 备份）")) return;
      S.roles.splice(rt.i, 1);
      save();
      location.hash = "#/";
      render(false);
    }
  });

  document.addEventListener("focusout", function (e) {
    var el = e.target;
    if (!EDIT || !el || !el.getAttribute || !el.getAttribute("data-path")) return;
    var path = el.getAttribute("data-path");
    var type = el.getAttribute("data-type") || "text";
    var v = el.textContent.replace(/\u00a0/g, " ").trim();
    var old = getPath(S, path);
    if (type === "num") {
      if (v === "") { el.textContent = old == null ? "" : old; return; }
      var n = parseFloat(v);
      if (isNaN(n)) { el.textContent = old == null ? "" : old; return; }
      v = n;
    }
    if (type === "date" && !/^\d{4}-\d{2}-\d{2}$/.test(v)) {
      alert("日期格式需为 YYYY-MM-DD，已还原。");
      el.textContent = old; return;
    }
    if (old === v) {
      if (pendingRemote) { var d0 = pendingRemote; pendingRemote = null; applyRemote(d0); }
      return;
    }
    setPath(S, path, v);
    save();
    if (pendingRemote) { var d = pendingRemote; pendingRemote = null; applyRemote(d); }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.getAttribute && e.target.getAttribute("data-path")) {
      e.preventDefault();
      e.target.blur();
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target.id === "q") {
      query = e.target.value;
      var c = document.getElementById("cards");
      if (c) c.innerHTML = cardsHTML();
    }
  });

  document.addEventListener("change", function (e) {
    if (e.target.id === "import-file" && e.target.files && e.target.files[0]) {
      importJSON(e.target.files[0]);
      e.target.value = "";
    }
  });

  /* ---------- 启动 ---------- */
  render(false);
  cloudInit();
  window.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden" && pushTimer) { clearTimeout(pushTimer); pushNow(); }
  });
})();  </script>
</body>
</html>
